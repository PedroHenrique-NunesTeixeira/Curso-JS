<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title> 
    <style>
        body {
            background-color: rgb(177, 134, 218);
            color:rgb(255, 255, 2); /* comentario*/ 
            font: normal 20pt ExtraBold;
        }
    </style>
</head>
<body>
    <h1>Óla, mundo!</h1> <!--comentario-->
    <p> Jesus me salvou </p></p>
    <script>
       var n1 = Number(window.prompt('Digite um número:'))//de string para number
       var n2 = Number(window.prompt('Digite outro número:'))//de string para number
       var s = n1 + n2
       window.alert('A soma dos valores é ' + String(s)) //concatenacao
    </script>
</body>
